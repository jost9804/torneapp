services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: torneapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-torneapp_dev}
      POSTGRES_DB: torneapp
    # Bound to localhost: Docker-published ports bypass host firewalls like ufw.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torneapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://torneapp:${DB_PASSWORD:-torneapp_dev}@db:5432/torneapp
      PORT: 3000
      # Signs login sessions; generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Comma-separated OAuth client IDs (web, iOS, Android) allowed to sign in with Google
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Resend API key for confirmation emails; without it codes only go to the API log
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-TorneApp <no-reply@torneapp.app>}
      # Comma-separated browser origins allowed to call the API; empty allows any
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

  # Web build + reverse proxy for the public site. Enable with COMPOSE_PROFILES=web.
  web:
    build: ./apps/mobile
    restart: unless-stopped
    profiles: ["web"]
    depends_on:
      - api
    # Localhost only: the tunnel reaches it over the Compose network.
    ports:
      - "127.0.0.1:8080:80"

  # Publishes web and api over HTTPS through Cloudflare, with no open router ports.
  # Enable with COMPOSE_PROFILES=web,tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    depends_on:
      - api
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}

volumes:
  pgdata:
  uploads:
